name: CD - Prod

on:
  push:
    branches: [main]

concurrency:
  group: backend-cd-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  release-check:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_version: ${{ steps.release-version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # main에 올라온 트리와 같은 트리를 가진 develop commit 중 health check까지 성공한 dev 배포가 있어야 운영에 나간다.
      # 이 검증은 main에 직접 머지된 hotfix처럼 dev를 거치지 않은 변경을 막는다.
      - name: dev 승격 검증
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "${GITHUB_REF_NAME}" = "main"
          ! git tag --points-at "${GITHUB_SHA}" |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'

          PROD_TREE=$(git rev-parse "${GITHUB_SHA}^{tree}")

          WORKFLOW_RUNS=$(curl --silent --show-error --fail-with-body \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/cd-dev.yml/runs?branch=develop&event=push&status=success&per_page=30")

          DEV_RUNS=$(jq --raw-output '
            .workflow_runs[] |
            select(.event == "push" and .conclusion == "success") |
            "\(.id) \(.head_sha)"
          ' <<< "${WORKFLOW_RUNS}")

          DEV_COMMIT_SHA=
          while read -r RUN_ID HEAD_SHA; do
            git cat-file -e "${HEAD_SHA}^{commit}" 2> /dev/null || continue
            test "$(git rev-parse "${HEAD_SHA}^{tree}")" = "${PROD_TREE}" || continue

            ARTIFACTS=$(curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")

            jq -e --arg name "dev-deployment-${HEAD_SHA}" '
              .artifacts | any(.name == $name and .expired == false)
            ' <<< "${ARTIFACTS}" > /dev/null || continue

            DEV_COMMIT_SHA=${HEAD_SHA}
            break
          done <<< "${DEV_RUNS}"

          test -n "${DEV_COMMIT_SHA}"
          echo "dev 배포 commit: ${DEV_COMMIT_SHA}"

      # 배포마다 직전 릴리스의 마이너 버전을 1 올린다. 메이저 버전 변경은 이 워크플로가 다루지 않는다 — 별도로 수동 태깅한다.
      - name: 다음 운영 버전 계산
        id: release-version
        run: |
          PREVIOUS_RELEASE=$(git tag --list 'v*' --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 || true)

          if [ -n "${PREVIOUS_RELEASE}" ]; then
            IFS='.' read -r MAJOR MINOR _ <<< "${PREVIOUS_RELEASE#v}"
            RELEASE_VERSION="v${MAJOR}.$((MINOR + 1)).0"
          else
            RELEASE_VERSION="v0.1.0"
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" > /dev/null
          TAG_STATUS=$?
          set -e
          test "${TAG_STATUS}" -eq 2

          echo "value=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: release-check
    if: >-
      github.workflow == 'CD - Prod' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: meongcoach-prod-ecr
      ECS_CLUSTER: meongcoach-prod-cluster
      ECS_SERVICE: meongcoach-prod-svc
      ECS_TASK_DEFINITION: meongcoach-prod-taskdef
      ECS_CONTAINER: api
      HEALTH_URL: https://api.meongcoach.com/api/health
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ secrets.PROD_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Buildx 설정
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: 이미지 빌드 및 푸시
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set +e
          docker buildx build --platform linux/amd64 --tag "${IMAGE_URI}" --push . 2>&1 | tee image-push.log
          PUSH_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${PUSH_STATUS}" -ne 0 ] &&
            grep -Eq "already exists.*immutable|cannot be overwritten because.*immutable" image-push.log; then
            echo "이미 존재하는 커밋 SHA 이미지를 재사용합니다: ${IMAGE_URI}"
          elif [ "${PUSH_STATUS}" -ne 0 ]; then
            exit "${PUSH_STATUS}"
          fi

      - name: 배포용 태스크 정의 생성
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.PROD_KAKAO_NATIVE_APP_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.PROD_KAKAO_REST_API_KEY }}
          APPLE_BUNDLE_ID: ${{ secrets.PROD_APPLE_BUNDLE_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.PROD_GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.PROD_GOOGLE_IOS_CLIENT_ID }}
          R2_ENDPOINT: ${{ secrets.PROD_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.PROD_R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.PROD_R2_PUBLIC_BASE_URL }}
          S3_REGION: ${{ secrets.PROD_S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.PROD_S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ secrets.PROD_S3_PUBLIC_BASE_URL }}
          VIMEO_ACCESS_TOKEN: ${{ secrets.PROD_VIMEO_ACCESS_TOKEN }}
          SQS_REGION: ${{ secrets.PROD_SQS_REGION }}
          SQS_ACCESS_KEY_ID: ${{ secrets.PROD_SQS_ACCESS_KEY_ID }}
          SQS_SECRET_ACCESS_KEY: ${{ secrets.PROD_SQS_SECRET_ACCESS_KEY }}
          AI_VIDEO_QUEUE: ${{ secrets.PROD_AI_VIDEO_QUEUE }}
          EVOLINK_API_KEY: ${{ secrets.PROD_EVOLINK_API_KEY }}
          EVOLINK_BASE_URL: ${{ secrets.PROD_EVOLINK_BASE_URL }}
          EVOLINK_MODEL: ${{ secrets.PROD_EVOLINK_MODEL }}
          SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          # 최신 인프라 설정을 읽고 GitHub Secrets·이미지를 반영한 등록용 JSON을 만든다.
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --query taskDefinition \
            --output json > current-task-definition.json

          bash .github/scripts/render-task-definition.sh \
            current-task-definition.json \
            "${ECS_CONTAINER}" \
            "${IMAGE_URI}" > task-definition.json

      # 위 script는 JSON만 만들며, 실제 AWS 변경은 여기서부터 시작한다.
      - name: 태스크 정의 리비전 등록
        id: task-definition
        run: |
          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=${NEW_TASK_DEFINITION}" >> "${GITHUB_OUTPUT}"

      - name: ECS 서비스 갱신
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --output json > /dev/null

      - name: ECS 서비스 안정화 대기
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

          DEPLOYMENT_STATE=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].[taskDefinition,desiredCount,runningCount]' \
            --output text)

          read -r DEPLOYED_TASK_DEFINITION DESIRED_COUNT RUNNING_COUNT <<< "${DEPLOYMENT_STATE}"
          test "${DEPLOYED_TASK_DEFINITION}" = "${TASK_DEFINITION_ARN}"
          test "${DESIRED_COUNT}" -ge 1
          test "${RUNNING_COUNT}" -ge 1

      - name: 운영 health check
        run: |
          for _ in {1..30}; do
            if curl --silent --show-error --fail --max-time 10 "${HEALTH_URL}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: 운영 배포 tag 생성
        env:
          RELEASE_VERSION: ${{ needs.release-check.outputs.release_version }}
        run: |
          PREVIOUS_RELEASE=$(git tag --list 'v*' --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 || true)

          if [ -n "${PREVIOUS_RELEASE}" ]; then
            COMMIT_RANGE="${PREVIOUS_RELEASE}..${GITHUB_SHA}"
          else
            COMMIT_RANGE="${GITHUB_SHA}"
          fi

          {
            echo "주요 작업"
            git log "${COMMIT_RANGE}" --pretty='- %s'
            echo
            echo "변경 사항"
            echo "- 운영 배포와 health check 성공"
            echo "- 배포 원본 commit: ${GITHUB_SHA}"
          } > tag-message.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${RELEASE_VERSION}" --file tag-message.txt "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_VERSION}"

  notify:
    needs: [ci, release-check, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 배포 결과 메시지 구성
        id: message
        env:
          CI_RESULT: ${{ needs.ci.result }}
          RELEASE_CHECK_RESULT: ${{ needs.release-check.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RELEASE_VERSION: ${{ needs.release-check.outputs.release_version }}
        run: |
          if [ "${DEPLOY_RESULT}" = "success" ]; then
            STATUS=":white_check_mark: 배포 성공"
          elif [ "${CI_RESULT}" != "success" ]; then
            STATUS=":x: 배포 실패 (ci: ${CI_RESULT})"
          elif [ "${RELEASE_CHECK_RESULT}" != "success" ]; then
            STATUS=":x: 배포 실패 (release-check: ${RELEASE_CHECK_RESULT})"
          else
            STATUS=":x: 배포 실패 (deploy: ${DEPLOY_RESULT})"
          fi

          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${RELEASE_VERSION:-미정}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      # SLACK_WEBHOOK_URL은 dev·prod CD가 공유하는 Slack Incoming Webhook URL이다.
      - name: Slack 알림 전송
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "[운영 CD] ${{ steps.message.outputs.status }}\n버전: ${{ steps.message.outputs.release_version }}\n저장소: ${{ github.repository }} (${{ github.ref_name }})\ncommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.message.outputs.short_sha }}>\n실행자: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로 실행 보기>"
            }
