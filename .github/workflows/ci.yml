name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
  # CD 워크플로우가 CI를 선행 job으로 호출할 수 있도록 재사용을 허용한다
  workflow_call:

jobs:
  test:
    # draft PR에서는 실행하지 않는다
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 커버리지 PR 코멘트 작성에 쓰기 권한이 필요하다
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless 포맷 검사
        run: ./gradlew spotlessCheck

      - name: 테스트 및 커버리지 검증
        run: ./gradlew test jacocoTestCoverageVerification

      - name: JaCoCo 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

      # PR에서만 실행 — push/workflow_call에는 코멘트를 달 PR이 없다
      - name: 커버리지 PR 코멘트
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: 📊 테스트 커버리지
          update-comment: true
