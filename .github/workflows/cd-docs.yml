name: CD - Docs

# CD - Dev의 deploy가 성공한 뒤 호출하는 재사용 워크플로다.
on:
  workflow_call:

jobs:
  deploy:
    # Pages 배포는 저장소당 사이트가 하나라 동시에 하나만 실행하고, 진행 중인 배포는 취소하지 않는다.
    # workflow_call로 호출되면 최상위 concurrency는 적용이 보장되지 않아 job 레벨에 둔다.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SWAGGER_UI_VERSION: 5.32.11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4

      - name: OpenAPI 스펙과 REST Docs HTML 생성
        run: ./gradlew openapi3 asciidoctor

      - name: 문서 사이트 조립
        run: bash .github/scripts/assemble-docs-site.sh site

      - name: Pages 설정
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # 저장소 Pages 설정이 꺼져 있으면 GitHub Actions 소스로 자동 활성화한다
          enablement: true

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
