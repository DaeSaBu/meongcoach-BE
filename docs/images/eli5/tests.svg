<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410">
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #333; text-anchor: middle; }
    .emoji { font-size: 60px; dominant-baseline: central; }
    .layer { font-size: 24px; font-weight: 800; }
    .kind { font-size: 20px; font-weight: 700; fill: #444; }
    .desc { font-size: 17px; fill: #666; }
    .guard { font-size: 22px; font-weight: 700; }
  </style>
  <rect x="2" y="2" width="896" height="406" rx="24" fill="#FFFDF7" stroke="#E8E2D4" stroke-width="2"/>
  <rect x="45" y="30" width="250" height="250" rx="20" fill="#D9F0DC" stroke="#8CC59A" stroke-width="3"/>
  <text class="emoji" x="170" y="95">🔬</text>
  <text class="layer" x="170" y="168">domain</text>
  <text class="kind" x="170" y="204">단위 테스트</text>
  <text class="desc" x="170" y="240">부품 하나만 콕</text>
  <rect x="325" y="30" width="250" height="250" rx="20" fill="#FFF1CC" stroke="#E0C068" stroke-width="3"/>
