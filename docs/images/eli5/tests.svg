  <text class="layer" x="730" y="168">adapter</text>
  <text class="kind" x="730" y="204">슬라이스 테스트</text>
  <text class="desc" x="730" y="240">문만 떼어서 (MockMvc)</text>
  <rect x="45" y="304" width="810" height="78" rx="18" fill="#EEEEEE" stroke="#C7C7C7" stroke-width="2"/>
  <text class="guard" x="450" y="351">🛡️ 경비원 테스트 · 규칙을 어기면 빌드가 멈춰요</text>
