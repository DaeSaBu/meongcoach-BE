    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker>
  </defs>
  <rect x="2" y="2" width="896" height="386" rx="24" fill="#FFFDF7" stroke="#E8E2D4" stroke-width="2"/>
  <rect x="60" y="150" width="220" height="90" rx="16" fill="#DCE9F7" stroke="#90B8DA" stroke-width="3"/>
