<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>멍코치 API 문서</title>
	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		body {
			display: flex;
			flex-direction: column;
			font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
			color: #1f2933;
		}
		header {
			flex: none;
			display: flex;
			align-items: center;
			gap: 1rem;
			padding: 0.5rem 1rem;
			border-bottom: 1px solid #d9e2ec;
		}
		h1 {
			margin: 0;
			font-size: 1rem;
		}
		nav {
			display: flex;
			gap: 0.25rem;
		}
		nav button {
			padding: 0.25rem 0.75rem;
			border: 1px solid #d9e2ec;
			border-radius: 0.375rem;
			background: #fff;
			font: inherit;
			font-size: 0.875rem;
			color: #1f2933;
			cursor: pointer;
		}
		nav button[aria-pressed="true"] {
			border-color: #2563eb;
			background: #2563eb;
			color: #fff;
		}
		p.hint {
			margin: 0 0 0 auto;
			font-size: 0.8125rem;
			color: #52606d;
		}
		main {
			flex: 1;
			display: flex;
			min-height: 0;
		}
		main iframe {
			flex: 1 1 0;
			min-width: 0;
			border: 0;
		}
		.pane-restdocs {
			border-right: 1px solid #d9e2ec;
		}
		main[data-view="restdocs"] .pane-swagger,
		main[data-view="swagger"] .pane-restdocs {
			display: none;
		}
		@media (max-width: 900px) {
			main[data-view="both"] {
				flex-direction: column;
			}
			main[data-view="both"] .pane-restdocs {
				border-right: 0;
				border-bottom: 1px solid #d9e2ec;
			}
			p.hint {
				display: none;
			}
		}
	</style>
</head>
<body>
	<header>
		<h1>멍코치 API 문서</h1>
		<nav aria-label="보기 전환">
			<button type="button" data-view="both" aria-pressed="true">둘 다</button>
			<button type="button" data-view="restdocs" aria-pressed="false">REST Docs</button>
			<button type="button" data-view="swagger" aria-pressed="false">Swagger</button>
		</nav>
		<p class="hint">develop 브랜치에 merge될 때마다 CI 통과 후 자동으로 갱신됩니다.</p>
	</header>
	<main data-view="both">
		<iframe class="pane-restdocs" src="./restdocs/index.html" title="REST Docs"></iframe>
		<!-- name="swagger"는 REST Docs 안 "Try it out" 링크(index.adoc의 window=swagger)의 타깃이다 -->
		<iframe class="pane-swagger" name="swagger" src="./swagger-ui/index.html" title="Swagger UI"></iframe>
	</main>
	<script>
		const main = document.querySelector("main");
		const buttons = document.querySelectorAll("nav button");

		function setView(view) {
			main.dataset.view = view;
			buttons.forEach((button) => {
				button.setAttribute("aria-pressed", String(button.dataset.view === view));
			});
		}

		buttons.forEach((button) => {
			button.addEventListener("click", () => setView(button.dataset.view));
		});

		// swagger-ui는 로드 시점에만 hash를 읽으므로, Try it out 딥링크로 hash만 바뀌면 리로드해 deep linking을 재적용한다
		const swagger = document.querySelector(".pane-swagger");
		swagger.addEventListener("load", () => {
			swagger.contentWindow.addEventListener("hashchange", () => {
				if (main.dataset.view === "restdocs") {
					setView("both");
				}
				swagger.contentWindow.location.reload();
			});
		});
	</script>
</body>
</html>
