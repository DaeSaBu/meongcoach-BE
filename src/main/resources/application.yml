spring:
  application:
    name: meongcoach
  profiles:
    # 프로파일 미지정 시 로컬 개발로 기동한다 — `./gradlew bootRun`만으로 실행 가능
    default: local
  jpa:
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  # 로그인 경로에 카카오 공개 키 조회가 끼므로 타임아웃을 반드시 건다 (기본값은 무제한)
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s
  cloud:
    aws:
      # 영상 업로드 이벤트 큐 소비용. S3 presigner와 별개의 자격 증명이라 SQS_ 접두사를 쓴다
      region:
        static: ${SQS_REGION}
      credentials:
        access-key: ${SQS_ACCESS_KEY_ID}
        secret-key: ${SQS_SECRET_ACCESS_KEY}
      sqs:
        # 기본 전략(CREATE)은 큐가 있어도 sqs:CreateQueue를 호출해 권한 403으로 기동이 죽는다.
        # 앱이 큐를 만들 이유가 없으므로 GetQueueUrl 조회만 하고, 큐가 없으면 명확히 실패하게 한다
        queue-not-found-strategy: fail

meongcoach:
  jwt:
    issuer: meongcoach
    # 기본값을 두지 않아 미주입 시 기동에 실패한다 — 커밋된 키가 배포로 흘러가는 것을 막는다
    secret: ${JWT_SECRET}
    access-token-validity: PT1H
    refresh-token-validity: P14D
  storage:
    r2:
      # R2는 S3 호환 API라 AWS SDK로 presigned URL을 발급한다. 값 미주입 시 기동에 실패한다
      endpoint: ${R2_ENDPOINT}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      bucket: ${R2_BUCKET}
      # 버킷에 연결된 공개 도메인(커스텀 도메인 또는 r2.dev). 클라이언트가 보낸 이미지 URL 검증 기준이 된다
      public-base-url: ${R2_PUBLIC_BASE_URL}
      upload-url-validity: PT10M
    s3:
      # 훈련 영상은 실제 AWS S3에 올린다. R2와 달리 엔드포인트가 아니라 리전으로 주소가 결정된다
      region: ${S3_REGION}
      access-key-id: ${S3_ACCESS_KEY_ID}
      secret-access-key: ${S3_SECRET_ACCESS_KEY}
      bucket: ${S3_BUCKET}
      # 버킷의 공개 도메인(CDN 또는 S3 표준 URL). 비공개 운영 시에도 응답의 publicUrl 조립에 쓰인다
      public-base-url: ${S3_PUBLIC_BASE_URL}
      # 영상은 파일 선택·압축 시간이 있어 이미지(PT10M)보다 여유를 둔다
      upload-url-validity: PT15M
      # AI 분석기가 이 URL로 영상을 가져가므로 분석 대기·재시도 시간을 감안해 넉넉히 둔다
      download-url-validity: PT1H
  ai:
    # S3 영상 업로드 완료 이벤트가 들어오는 SQS 큐 이름
    video-queue: ${AI_VIDEO_QUEUE}
    # 영상 분석에 쓰는 Bedrock Converse 연동 설정. Spring AI 없이 AWS SDK로 직접 호출한다
    # (Spring AI는 사용자 메시지의 콘텐츠 순서를 강제할 수 없어 제거했다. BedrockVideoAnalyzer 참고)
    bedrock:
      region: ${BEDROCK_REGION}
      access-key-id: ${BEDROCK_ACCESS_KEY_ID}
      secret-access-key: ${BEDROCK_SECRET_ACCESS_KEY}
      # Converse의 영상 입력은 Nova 계열만 지원한다. 리전에 따라 인퍼런스 프로파일 ID가 필요할 수 있다
      model: ${BEDROCK_MODEL:global.amazon.nova-2-lite-v1:0}
      # 영상 분석은 수십 초가 걸려 SDK 기본 소켓 타임아웃(30초)으로는 응답 전에 끊긴다
      response-timeout: PT5M
  social:
    kakao:
      issuer: https://kauth.kakao.com
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      # id_token의 aud 후보. 네이티브 앱은 네이티브 앱 키, 웹은 REST API 키라 쉼표로 나열한다.
      # 다른 앱에서 발급된 토큰을 걸러내는 값이므로 반드시 우리 앱의 키만 넣는다
      audiences: ${KAKAO_NATIVE_APP_KEY},${KAKAO_REST_API_KEY}
