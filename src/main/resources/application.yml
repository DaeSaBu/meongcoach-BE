spring:
  application:
    name: meongcoach
  datasource:
    url: jdbc:h2:mem:meongcoach
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # 로그인 경로에 카카오 공개 키 조회가 끼므로 타임아웃을 반드시 건다 (기본값은 무제한)
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s

meongcoach:
  jwt:
    issuer: meongcoach
    # 기본값을 두지 않아 미주입 시 기동에 실패한다 — 커밋된 키가 배포로 흘러가는 것을 막는다
    secret: ${JWT_SECRET}
    access-token-validity: PT1H
    refresh-token-validity: P14D
  social:
    kakao:
      issuer: https://kauth.kakao.com
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      # id_token의 aud 후보. 네이티브 앱은 네이티브 앱 키, 웹은 REST API 키라 쉼표로 나열한다.
      # 다른 앱에서 발급된 토큰을 걸러내는 값이므로 반드시 우리 앱의 키만 넣는다
      audiences: ${KAKAO_AUDIENCES}
