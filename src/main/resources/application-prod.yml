# 운영 — 스키마를 자동 변경하지 않는다. 엔티티와 스키마가 불일치하면 기동에 실패한다 (validate)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

# springdoc은 developmentOnly 의존성이라 배포 환경에 없지만, 스코프가 바뀌어도 노출되지 않도록 방어적으로 끈다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

meongcoach:
  cors:
    allowed-origin-patterns:
      - https://app.meongcoach.com
