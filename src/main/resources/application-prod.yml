# 운영 — 스키마를 자동 변경하지 않는다. 엔티티와 스키마가 불일치하면 기동에 실패한다 (validate)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

meongcoach:
  # 기본값이 이미 false지만 운영에서 문서를 차단한다는 의도를 명시한다
  api-docs:
    enabled: false
  # 서울 8·11·17시 알림 발송 트리거. 재활성화 전까지 운영에서도 끈다
  notification:
    scheduler:
      enabled: false
    # 댓글 알림 발송. 재활성화 전까지 운영에서 끈다
    comment:
      enabled: false

sentry:
  environment: production
