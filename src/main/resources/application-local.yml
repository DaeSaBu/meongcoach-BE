# 로컬 실행 — bastion 호스트 SSH 터널로 dev DB에 접속한다. 접속 정보는 기본값이 없어 미주입 시 기동에 실패한다
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # dev DB의 마이그레이션은 dev 서버 배포가 적용하므로 로컬에서는 실행하지 않는다
  flyway:
    enabled: false
  jpa:
    hibernate:
      # 공유 DB이므로 스키마를 변경하지 않고 엔티티와의 일치만 검증한다
      ddl-auto: validate
  cloud:
    aws:
      # 로컬은 실제 큐 없이 기동한다. 실 큐로 소비를 확인하려면 켜고 SQS_ 환경 변수에 실제 값을 넣는다
      sqs:
        enabled: false

meongcoach:
  # 로컬에서는 /swagger-ui/** 문서 페이지를 인증 없이 연다
  api-docs:
    enabled: true
