# 로컬 개발 전용 — PostgreSQL 스키마를 재생성한 뒤 정적 교육 초기 데이터를 반영한다
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:meongcoach}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:meongcoach_local}
    password: ${DB_PASSWORD:meongcoach-local}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      data-locations: classpath:db/local/training-initial-data.sql
      mode: always
  cloud:
    aws:
      # 로컬은 실제 큐 없이 기동한다. 실 큐로 소비를 확인하려면 켜고 SQS_ 환경 변수에 실제 값을 넣는다
      sqs:
        enabled: false

# 로컬 Swagger UI — 스펙은 springdoc 자동 스캔이 아니라 빌드 산출물(build/api-spec/openapi3.json)을 쓴다.
# api-docs.enabled=false로 두면 springdoc 3.x에서는 UI 빈 전체가 함께 꺼지므로 기본값을 유지하고,
# 자동 스캔 엔드포인트(/v3/api-docs)는 시큐리티 permitAll에서 제외해 가린다
springdoc:
  swagger-ui:
    url: /openapi3.json

meongcoach:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
