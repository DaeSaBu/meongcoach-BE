# 로컬 개발 전용 — 인메모리 H2라 별도 DB 준비 없이 기동한다
spring:
  datasource:
    url: jdbc:h2:mem:meongcoach
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    aws:
      # 로컬은 실제 큐 없이 기동한다. 실 큐로 소비를 확인하려면 켜고 SQS_ 환경 변수에 실제 값을 넣는다
      sqs:
        enabled: false

meongcoach:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
