# 로컬 개발 전용 — 인메모리 H2라 별도 DB 준비 없이 기동한다
spring:
  datasource:
    url: jdbc:h2:mem:meongcoach
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

meongcoach:
  dev-login-token: ${DEV_LOGIN_TOKEN:local-development-login-token-32-bytes}
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
