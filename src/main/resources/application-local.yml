# 로컬 개발 전용 — PostgreSQL 스키마를 자동 갱신한다
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:meongcoach}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:meongcoach_local}
    password: ${DB_PASSWORD:meongcoach-local}
  jpa:
    hibernate:
      ddl-auto: update

meongcoach:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
