# 로컬 개발 전용 — PostgreSQL 스키마를 갱신한 뒤 정적 교육 초기 데이터를 반영한다
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:meongcoach}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:meongcoach_local}
    password: ${DB_PASSWORD:meongcoach-local}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      data-locations: classpath:db/local/training-initial-data.sql
      mode: always
  cloud:
    aws:
      # 로컬은 실제 큐 없이 기동한다. 실 큐로 소비를 확인하려면 켜고 SQS_ 환경 변수에 실제 값을 넣는다
      sqs:
        enabled: false

meongcoach:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
