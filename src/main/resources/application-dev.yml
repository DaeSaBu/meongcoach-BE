# 개발 서버 — PostgreSQL. 접속 정보는 배포 환경 변수로 주입하며 기본값이 없어 미주입 시 기동에 실패한다
spring:
  # 로컬에서 dev 프로파일로 실행할 때 compose 지원이 로컬 postgres를 띄워 dev DB 접속 정보를 덮어쓰는 것을 막는다.
  # 배포 환경에서는 compose 모듈 자체가 jar에 없어(developmentOnly) 이 설정은 무시된다.
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 마이그레이션 도구 도입 전까지 엔티티 변경을 자동 반영한다. 컬럼 삭제·이름 변경은 반영되지 않는다
      ddl-auto: update

# Sentry 대시보드에서 dev 이벤트를 구분하는 환경 태그
sentry:
  environment: dev

meongcoach:
  # 개발 서버에서는 /swagger-ui/** 문서 페이지를 인증 없이 연다
  api-docs:
    enabled: true
  cors:
    allowed-origin-patterns:
      - https://app.dev.meongcoach.com
