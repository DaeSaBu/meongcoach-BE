# 로컬 개발용 구성 — IDE/bootRun 실행 시 spring-boot-docker-compose가 postgres만 자동 기동한다.
# backend는 compose profile "app"으로 게이팅되어 `docker compose --profile app up --build`로만 뜬다.
services:
  postgres:
    image: postgres:18.3
    # DB 접속 값의 단일 출처. backend의 DB_*는 아래 앵커를 참조한다
    environment:
      POSTGRES_DB: &db-name meongcoach
      POSTGRES_USER: &db-user meongcoach_local
      POSTGRES_PASSWORD: &db-password meongcoach-local
    healthcheck:
      # $$는 compose 이스케이프 — 컨테이너 셸이 위 POSTGRES_* 환경 변수를 읽어 값 중복을 없앤다
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    # 로컬 DB는 일회용 — RAM에 두어 컨테이너 정지 시 초기화되고 익명 볼륨 잔여물도 남기지 않는다
    tmpfs:
      - /var/lib/postgresql
  backend:
    profiles: ["app"]
    build:
      context: .
    # env_file은 시크릿·앱 설정(.env), environment는 compose 토폴로지 종속 값. 겹치면 environment가 우선한다
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_NAME: *db-name
      DB_USERNAME: *db-user
      DB_PASSWORD: *db-password
      # profiles.default가 바뀌어도 컨테이너 모드는 local로 고정한다
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
